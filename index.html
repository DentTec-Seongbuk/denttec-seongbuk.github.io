<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>덴트텍 성북점 | 후기 남기기</title>
<meta name="description" content="덴트텍 성북점 후기 남기기">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --red: #e10a17;
    --ink: #17191c;
    --muted: #70767c;
    --faint: #a3a8ad;
    --line: #ebedef;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }
  .page {
    max-width: 420px;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-top: 24px;
    padding-bottom: 24px;
  }

  .brand {
    text-align: center;
  }
  .brand img {
    width: 52%;
    max-width: 210px;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .branch {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.32em;
    padding-left: 0.32em;
  }

  .intro { text-align: center; margin-top: 36px; }
  h1 {
    font-size: 27px;
    line-height: 1.35;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .sub {
    margin-top: 10px;
    font-size: 15px;
    line-height: 1.65;
    color: var(--muted);
  }

  .ask {
    margin-top: 32px;
    margin-bottom: 14px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .choice {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 96px;
    padding: 20px 20px 20px 18px;
    border-radius: 24px;
    text-decoration: none;
    color: var(--ink);
    transition: transform .12s ease;
  }
  .choice:active { transform: scale(0.97); }
  .choice:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  .g { background: #f1f4f9; }
  .n { background: #e9f9f0; }
  .badge {
    flex: none;
    width: 56px; height: 56px;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px -6px rgba(23,25,28,.25);
  }
  .badge svg { width: 28px; height: 28px; }
  .g .badge { background: #fff; }
  .n .badge { background: #03c75a; }
  .n .badge svg { width: 22px; height: 22px; }
  .text { flex: 1; min-width: 0; }
  .main { display: block; font-size: 19px; font-weight: 700; letter-spacing: -0.025em; }
  .small { display: block; margin-top: 4px; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .chev { flex: none; width: 20px; height: 20px; color: #a9b0b6; }

  .foot {
    margin-top: 22px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }

  @media (max-height: 700px) {
    .intro { margin-top: 24px; }
    .ask { margin-top: 22px; }
    .choice { min-height: 84px; }
    .foot { margin-top: 16px; }
  }
</style>
</head>
